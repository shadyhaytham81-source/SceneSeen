# SceneSeen Phase 1 configuration.
# Override any value with a second TOML file:  --config config/tuned.toml
# Only [grouping] affects the fast re-grouping step; changing [shots] or
# [features] invalidates the corresponding cache entries automatically.

[paths]
cache_dir = "data/cache"
uploads_dir = "data/uploads"
exports_dir = "data/exports"
ground_truth_dir = "ground_truth"
videos_dir = "data/videos"

[shots]
# "transnetv2" (neural, also catches dissolves/fades) or "pyscenedetect" (fast, hard cuts)
detector = "transnetv2"
transnet_threshold = 0.5
transnet_device = "cpu"          # MPS is numerically inconsistent for TransNetV2
pyscenedetect_threshold = 3.0    # AdaptiveDetector adaptive_threshold
min_shot_seconds = 0.4           # shorter "shots" (flashes, mis-detections) are merged into a neighbour

[features]
model = "ViT-B-32"
pretrained = "laion2b_s34b_b79k"
device = "auto"                  # auto -> mps / cuda / cpu
batch_size = 64
frame_positions = [0.15, 0.5, 0.85]   # relative positions inside each shot
frame_short_side = 224
color_bins = [8, 4, 4]           # HSV histogram bins

[grouping]
# Shot-to-shot similarity = weighted blend of semantic (CLIP) and colour similarity.
clip_weight = 0.75
color_weight = 0.25
# CLIP cosine similarities live in roughly [clip_floor, 1]; rescale to [0, 1].
clip_floor = 0.5
# Context window around each cut (shots are only linked if within both limits).
window_shots = 6
window_seconds = 45.0
# Penalty per intermediate shot when linking far-apart shots (A ... A).
distance_penalty = 0.01
# Coherence across a cut = mean of the top-k cross-cut similarities.
coherence_topk = 2
# A cut becomes a scene boundary only if its score passes BOTH tests:
abs_threshold = 0.45             # boundary score = 1 - coherence
depth_threshold = 0.35           # TextTiling depth: how clearly the cut is a local peak
strong_threshold = 0.75          # scores above this skip the depth test
# "climb": TextTiling downhill depth; "window": prominence vs. lowest cut within window_shots/2 cuts
depth_mode = "climb"
min_scene_seconds = 6.0

[export]
# "reencode": frame-accurate (libx264), verified against source frames. Default.
# "copy": lossless stream copy, near-instant, but only keyframe-accurate (edges can be off by a few frames)
clip_mode = "reencode"
crf = 18
preset = "veryfast"

[unique_shots]
# Repeated-shot grouping inside each scene. Pure post-processing: scene segmentation is unaffected.
# p(duplicate) = sigmoid(w_clip*clip_matched + w_color*color + w_phash*phash + bias)
# Calibrated on 177 labelled shot pairs (leave-one-video-out AUC 0.985): docs/UNIQUE_SHOTS.md
w_clip = 2.776
w_color = 3.540
w_phash = 4.089
bias = -7.886
duplicate_threshold = 0.60       # held-out precision 0.97, recall 0.91
different_threshold = 0.35       # below this: different shot; in between: "uncertain" (reported, never merged)
phash_neutral = 0.60             # layout value used when a thumbnail is missing
linkage = "average"
# representative shot = weighted ranks inside the group
rep_w_centrality = 0.35
rep_w_sharpness = 0.25
rep_w_duration = 0.20
rep_w_stability = 0.10
rep_w_exposure = 0.10

[boundary_model]
# Optional learned scene-boundary classifier (python -m sceneseen train). Empty = hand-designed rule.
path = ""

[commercial]
# Phase 2A: commercial objects + scene context. Runs on top of Phase 1 and never changes it.
detector = "owlv2"               # owlv2 (google/owlv2-base-patch16-ensemble, Apache-2.0) | grounding_dino
device = "auto"                  # auto -> cuda / mps / cpu (falls back to CPU if the accelerator fails)
batch_size = 4
frame_long_side = 1280           # representative frames are extracted at this size
frame_positions = [0.5]          # one frame per unique shot; [0.15, 0.5, 0.85] = 3x the time for ~7 more borderline objects
store_threshold = 0.10           # detections kept in the cache, so display thresholds can change without re-running the model
min_confidence = 0.40            # global display floor; each object type adds its own tier (commercial/taxonomy.py)
min_relevance = 0.45             # commercial relevance needed to be shown
describe_colors = true           # "White sneakers" when one colour clearly dominates
context_min_confidence = 0.60    # scene venue is reported only when this sure ...
context_min_margin = 0.15        # ... and this far ahead of the runner-up

[catalog]
# Phase 2B: brand / product catalogue. SQLite by default (one local file, no server). Any SQLAlchemy URL
# works; for production use PostgreSQL: "postgresql+psycopg://user:password@host/sceneseen".
# The environment variable SCENESEEN_DATABASE_URL overrides this (keep credentials out of this file).
database_url = "sqlite:///data/catalog/catalog.db"
images_dir = "data/catalog/images"     # content-addressed product images (sha256 file names)

[matching]
# EXPERIMENTAL — DISABLED. Automatic product matching is NOT part of SceneSeen's workflow: products are
# identified by people (docs/IDENTIFICATION.md). Nothing in the app, the CLI or the pipeline reads this
# section; only the research scripts do (scripts/product_matching_study.py, docs/EXPERIMENTAL_MATCHING.md).
embedder = "openclip_b32"        # same weights Phase 1 already uses; DINOv2 small/base were not better (docs/EXPERIMENTAL_MATCHING.md)
device = "auto"
batch_size = 32
colour_weight = 0.5              # score = cosine + colour_weight * colour-histogram intersection
max_occurrences = 5              # occurrence crops of one object that are averaged
crop_pad = 0.08
shortlist = 200                  # images kept after the cosine stage before colour re-ranking
top_k = 5                        # candidates shown per object
# match confidence = sigmoid(conf_w_score*score + conf_w_margin*(lead over the next product) + conf_bias)
conf_w_score = 2.703
conf_w_margin = 18.441
conf_bias = -4.991
high_confidence = 0.80           # held-out: 93 % of these were the right product
possible_confidence = 0.50       # held-out: 58 %
uncertain_confidence = 0.25      # below this: "no reliable match" (held-out: 9 %)
background_score = 1.047         # score a WRONG product typically reaches (used when there is no runner-up)
min_products_for_high = 5        # fewer comparable products than this: never "high confidence"
calibration_version = "2026-10-05/openclip_b32/colour0.5/62-objects"
